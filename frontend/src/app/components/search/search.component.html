<div class="search-row">
<div class="form-header input-group">
  <input #userInput
    class="form-control"
         type="text"
  placeholder="Search a Gundam's name"
  (keyup.enter)="runSearch(userInput.value)">

    <button (click)="runSearch(userInput.value)"
    class="btn btn-light"
    >Search</button>

</div>

<button routerLink="/addGundam" class="btn btn-light btn-add">
  Add Gundam
</button>
</div>
